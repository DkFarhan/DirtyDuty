services:
  postgres:
    image: postgres:17
    container_name: dirty-duty-postgres

    environment:
      POSTGRES_DB: dirtyduty
      POSTGRES_USER: dirtyduty_user
      POSTGRES_PASSWORD: dirtyduty_dev_password

    ports:
      - "5432:5432"

    volumes:
      - dirtyduty_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dirtyduty_user -d dirtyduty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dirtyduty_postgres_data: