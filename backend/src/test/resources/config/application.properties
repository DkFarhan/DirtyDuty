# Test-only overrides, loaded in addition to src/main/resources/application.yaml.
# Background occurrence generation would otherwise run shortly after each test context starts
# and generate occurrences in the middle of unrelated tests. Tests invoke
# OccurrenceGenerationScheduler.run() directly instead.
app.chores.generation.enabled=false

# Tests run with the ci profile (its scratch datasource) unless a profile is chosen explicitly.
# TestDatabaseGuard refuses any other profile and the local development database "dirtyduty".
spring.profiles.default=ci
