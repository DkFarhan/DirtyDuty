spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/dirtyduty}
    username: ${DB_USERNAME:dirtyduty_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            checkserveridentity: ${MAIL_TLS_VERIFY_SERVER_IDENTITY:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:30d}
    jdbc:
      initialize-schema: never

app:
  base-url: ${APP_BASE_URL:https://example.invalid}
  auth:
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    password-reset:
      enabled: ${PASSWORD_RESET_ENABLED:false}
      token-ttl: ${PASSWORD_RESET_TTL:30m}
      rate-limit-hmac-secret: ${AUTH_RATE_LIMIT_HMAC_SECRET:}
      request-email-limit: ${PASSWORD_RESET_EMAIL_LIMIT:3}
      request-ip-limit: ${PASSWORD_RESET_IP_LIMIT:5}
      confirm-ip-limit: ${PASSWORD_RESET_CONFIRM_IP_LIMIT:10}
    email-verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:true}
      delivery-enabled: ${EMAIL_VERIFICATION_DELIVERY_ENABLED:true}
  frontend:
    origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  households:
    invitation-expiration: ${HOUSEHOLD_INVITATION_EXPIRATION:7d}
  security:
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
  notifications:
    scheduler-delay: ${NOTIFICATION_SCHEDULER_DELAY:60000}
    web-push:
      public-key: ${WEB_PUSH_PUBLIC_KEY:}
      private-key: ${WEB_PUSH_PRIVATE_KEY:}
      subject: ${WEB_PUSH_SUBJECT:mailto:support@dirtyduty.app}

server:
  port: 8080
  forward-headers:
    strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        max-age: ${SESSION_COOKIE_MAX_AGE:365d}
        same-site: lax
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
