spring:
  application:
    name: dirty-duty

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dirtyduty}
    username: ${DB_USERNAME:dirtyduty_user}
    password: ${DB_PASSWORD:dirtyduty_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:24h}
    jdbc:
      initialize-schema: never

app:
  frontend:
    origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  households:
    invitation-expiration: ${HOUSEHOLD_INVITATION_EXPIRATION:7d}
  security:
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /