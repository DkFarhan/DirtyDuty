spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dirtyduty_ci}
    username: ${DB_USERNAME:dirtyduty_ci_user}
    password: ${DB_PASSWORD:dirtyduty_ci_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

app:
  frontend:
    origins: ${FRONTEND_ORIGINS:http://localhost:3000}
  households:
    invitation-expiration: ${HOUSEHOLD_INVITATION_EXPIRATION:7d}
  security:
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  notifications:
    scheduler-delay: ${NOTIFICATION_SCHEDULER_DELAY:60000}
    web-push:
      public-key: ${WEB_PUSH_PUBLIC_KEY:}
      private-key: ${WEB_PUSH_PRIVATE_KEY:}
      subject: ${WEB_PUSH_SUBJECT:mailto:support@dirtyduty.app}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /
