name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test -- --run

      - name: Build frontend
        run: pnpm build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dirtyduty_ci
          POSTGRES_USER: dirtyduty_ci_user
          POSTGRES_PASSWORD: dirtyduty_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dirtyduty_ci_user -d dirtyduty_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:postgresql://localhost:5432/dirtyduty_ci
      DB_USERNAME: dirtyduty_ci_user
      DB_PASSWORD: dirtyduty_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check backend formatting
        working-directory: backend
        run: ./mvnw -B spotless:check

      - name: Build and verify backend
        working-directory: backend
        run: ./mvnw -B clean verify

  database-migration:
    name: Database Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dirtyduty_ci
          POSTGRES_USER: dirtyduty_ci_user
          POSTGRES_PASSWORD: dirtyduty_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dirtyduty_ci_user -d dirtyduty_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SPRING_PROFILES_ACTIVE: ci
      DB_URL: jdbc:postgresql://localhost:5432/dirtyduty_ci
      DB_USERNAME: dirtyduty_ci_user
      DB_PASSWORD: dirtyduty_ci_password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Validate fresh database migration and startup
        working-directory: backend
        run: ./mvnw -B -Dtest=FreshDatabaseMigrationSmokeTest test
